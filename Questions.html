<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Questions</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        body {
            scroll-behavior: smooth;
            background-color: rgb(245, 222, 222);
        }

        .contain {
            padding: 13px;
            margin: 9px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .contain h1 {
            background-color: rgb(11, 11, 9);
            color: rgb(253, 194, 152);
            padding: 10px;
            border-radius: 5px;
        }

        .quiz {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .question-box {
            background-color: white;
            padding: 15px;
            margin: 25px;
            border-radius: 6px;

        }

        .question-box h3 {
            margin-top: 11px;
        }

        label {
            display: flex;
            align-items: center;
            cursor: pointer;

        }

        input[type="radio"] {
            margin-right: 6px;
        }

        button {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            background-color: chartreuse;
            border: none;
            border-radius: 6px;
            box-shadow: 1 4px 9px rgba(0, 0, 0, 0.5); 
            cursor:pointer;
        }

        button:hover {
            background-color: rgb(185, 219, 249);
        }

        #result {
            text-align: center;
            font-size: 11px;
            font-weight: bolder;


        }

        @media screen and (max-width:768px) {
            .contain {
                padding: 6px;
                margin: 3px;
            }
        }
    </style>
</head>

<body>

    <div class="contain">
        <h1>Online Test</h1>
    </div>

    <div id="quiz"></div>

    <button onclick="submit()">Submit</button>

    <div id="result"></div>

    <script>
        let ques = [
            {
                question: "Which layer of the OSI model is responsible for packet routing?",
                options: ["Physical layer", "Data Link layer", "Network layer", "Transport layer"],
                answer: "Network layer"
            },
            {
                question: "What is the full form of IP?",
                options: ["Internet Protocol", "Interface Program", "Internet Packet", "Internal Path"],
                answer: "Internet Protocol"
            },
            {
                question: "Which network device operates at the physical layer?",
                options: ["Router", "Hub", "Switch", "Bridge"],
                answer: "Hub"
            },
            {
                question: "How many bits are in an IPv4 address?",
                options: ["16 bits", "32 bits", "64 bits", "128 bits"],
                answer: "32 bits"
            },
            {
                question: "Which network topology uses a central controller or hub?",
                options: ["Bus topology", "Star topology", "Mesh topology", "Ring topology"],
                answer: "Star topology"
            },
            {
                question: "Which protocol is used to send email over the internet?",
                options: ["FTP", "SNMP", "SMTP", "HTTP"],
                answer: "SMTP"
            },
            {
                question: "What does DNS stand for?",
                options: ["Digital Network System", "Domain Name System", "Data Numbering Service", "Dynamic Node Switch"],
                answer: "Domain Name System"
            },
            {
                question: "Which cable type transmits data using light signals?",
                options: ["Twisted pair cable", "Coaxial cable", "Fiber optic cable", "Ethernet cable"],
                answer: "Fiber optic cable"
            },
            {
                question: "How many bits are in an IPv6 address?",
                options: ["32 bits", "64 bits", "128 bits", "256 bits"],
                answer: "128 bits"
            },
            {
                question: "Which OSI layer is closest to the end user?",
                options: ["Transport layer", "Network layer", "Application layer", "Session layer"],
                answer: "Application layer"
            }
        ];

        function show() {
            let output = "";
            for (let i = 0; i < ques.length; i++) {
                output += '<div class="question-box">';
                output += "<h3>" + (i + 1) + ". " + ques[i].question + "</h3>";
                for (let j = 0; j < ques[i].options.length; j++) {
                    let optionValue = ques[i].options[j].trim();
                    output += '<label>' +
                        '<input type="radio" name="q' + i + '" value="' + optionValue + '"> ' +
                        ques[i].options[j] +
                        '</label>';
                }
                output += "</div>";
            }
            document.getElementById("quiz").innerHTML = output;
        }

        function submit() {
            let score = 0;
            for (let i = 0; i < ques.length; i++) {
                let selected = document.querySelector('input[name="q' + i + '"]:checked');


                if (selected && selected.value === ques[i].answer) {
                    score++;
                }
            }
            document.getElementById("result").innerHTML = "Your Score: " + score + " / " + ques.length;
        }
        show();
    </script>
</body>

</html>
